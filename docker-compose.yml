# version: '3.8'

services:
  # servicio 1: la base de datos
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app", "psql -c 'CREATE EXTENSION IF NOT EXISTS vector;'"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env
    environment:
      - PORT=8080
    command: sh -c "alembic upgrade head && uv run uvicorn src:app --app-dir src --host 0.0.0.0 --port ${PORT:-8080}"

  # frontend: standalone nextjs
