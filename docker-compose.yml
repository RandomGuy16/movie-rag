services:
  # Vector Database: PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: gemma_rag_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gemma_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gemma_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI Backend API + Static Web Frontend
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: gemma_rag_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gemma_rag
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

volumes:
  postgres_data:
