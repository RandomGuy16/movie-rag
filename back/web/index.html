<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 class="title">Gemma RAG</h1>
                <span class="status">
                    <span id="status-dot" class="dot"></span>
                    <span id="status-text">Connecting...</span>
                </span>
            </div>
            <div class="header-right">
                <span id="memory-indicator" class="memory">Memory: empty</span>
            </div>
        </header>

        <main class="main">
            <section class="chat">
                <div id="messages" class="messages">
                    <div class="message system">
                        Ask about a movie. The model retrieves similar titles from the TMDB dataset, then answers.
                    </div>
                </div>
                <form id="chat-form" class="chat-form">
                    <textarea id="user-prompt" placeholder="Ask about a movie..." rows="1" required></textarea>
                    <button type="submit" id="btn-send">Send</button>
                </form>
            </section>

            <aside class="settings">
                <div class="settings-group">
                    <label for="model-select">Model</label>
                    <select id="model-select"></select>
                    <input type="text" id="model-custom" placeholder="Or type a custom model name...">
                </div>

                <div class="settings-group">
                    <label for="system-prompt">System prompt</label>
                    <textarea id="system-prompt" placeholder="Optional. Overrides the default RAG system prompt."></textarea>
                </div>

                <div class="settings-group">
                    <div class="range-row">
                        <label for="param-temp">Temperature</label>
                        <span id="val-temp" class="range-value">0.8</span>
                    </div>
                    <input type="range" id="param-temp" min="0" max="2" step="0.1" value="0.8">
                </div>

                <div class="settings-group">
                    <div class="settings-row">
                        <label for="param-stream">Stream</label>
                        <label class="switch">
                            <input type="checkbox" id="param-stream" checked>
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                </div>

                <details class="settings-group">
                    <summary>Request payload</summary>
                    <pre id="payload-preview">{}</pre>
                </details>

                <button id="btn-clear-mem" class="ghost-btn">Clear memory</button>
            </aside>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
